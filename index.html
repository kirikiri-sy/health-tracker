<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瘦身追踪</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F5F0;
    --card: #FFFFFF;
    --ink: #1A1A18;
    --ink2: #6B6B65;
    --ink3: #AEADA6;
    --accent: #4A7C6F;
    --accent2: #C5603A;
    --accent-light: #E8F0EE;
    --border: #E8E6E0;
    --radius: 16px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 2rem 1.5rem 4rem;
  }

  header {
    max-width: 720px;
    margin: 0 auto 2.5rem;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }

  .logo-block h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2.2rem;
    font-weight: 400;
    color: var(--ink);
    line-height: 1.1;
  }

  .logo-block p {
    font-size: 0.8rem;
    color: var(--ink3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .goal-pill {
    background: var(--accent);
    color: white;
    font-size: 0.75rem;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 100px;
    letter-spacing: 0.04em;
  }

  .grid {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 1.5rem;
  }

  .card-label {
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 1rem;
  }

  /* Stats row */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
  }

  .stat-item { text-align: center; }

  .stat-val {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    font-weight: 400;
    color: var(--ink);
    line-height: 1;
  }

  .stat-val span {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 300;
    color: var(--ink3);
  }

  .stat-label {
    font-size: 0.72rem;
    color: var(--ink3);
    margin-top: 4px;
  }

  .stat-delta {
    font-size: 0.72rem;
    margin-top: 3px;
    font-weight: 500;
  }

  .delta-down { color: var(--accent); }
  .delta-up { color: var(--accent2); }
  .delta-neutral { color: var(--ink3); }

  /* Progress bar */
  .progress-wrap { margin-top: 0.75rem; }
  .progress-labels {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    color: var(--ink3);
    margin-bottom: 6px;
  }
  .progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 100px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 100px;
    transition: width 0.6s ease;
  }

  /* Chart tabs */
  .chart-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 1.25rem;
  }

  .tab-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    padding: 5px 14px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--ink2);
    cursor: pointer;
    transition: all 0.2s;
  }

  .tab-btn.active {
    background: var(--ink);
    color: white;
    border-color: var(--ink);
  }

  .chart-wrap { position: relative; height: 200px; }

  /* Form */
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
  }

  .form-full { grid-column: 1 / -1; }

  .field label {
    display: block;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 6px;
  }

  .field input, .field textarea {
    width: 100%;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
    resize: none;
  }

  .field input:focus, .field textarea:focus {
    border-color: var(--accent);
  }

  .btn-save {
    width: 100%;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    padding: 12px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 0.25rem;
  }

  .btn-save:hover { opacity: 0.88; }
  .btn-save:active { transform: scale(0.98); }

  /* Log */
  .log-list { display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; }

  .log-row {
    display: grid;
    grid-template-columns: 80px 1fr 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--bg);
    border-radius: 10px;
    font-size: 0.82rem;
  }

  .log-date { color: var(--ink3); font-size: 0.75rem; }
  .log-weight { font-weight: 500; }
  .log-fat { color: var(--ink2); }
  .log-note { color: var(--ink3); font-size: 0.72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .del-btn {
    background: none;
    border: none;
    color: var(--ink3);
    cursor: pointer;
    font-size: 0.85rem;
    padding: 2px 4px;
    border-radius: 4px;
    transition: color 0.2s;
  }
  .del-btn:hover { color: var(--accent2); }

  .empty-state {
    text-align: center;
    color: var(--ink3);
    font-size: 0.82rem;
    padding: 1.5rem 0;
    font-style: italic;
  }

  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: white;
    font-size: 0.8rem;
    padding: 10px 20px;
    border-radius: 100px;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .divider-line {
    height: 1px;
    background: var(--border);
    margin: 1rem 0;
  }
</style>
</head>
<body>

<header>
  <div class="logo-block">
    <h1>瘦身追踪</h1>
    <p>2026年5月 · 健康计划</p>
  </div>
  <div class="goal-pill">目标 52 kg</div>
</header>

<div class="grid">

  <!-- Stats card -->
  <div class="card" id="stats-card">
    <div class="card-label">本月概览</div>
    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-val" id="cur-weight">—<span>kg</span></div>
        <div class="stat-label">当前体重</div>
        <div class="stat-delta delta-neutral" id="weight-delta">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="cur-fat">—<span>%</span></div>
        <div class="stat-label">当前体脂</div>
        <div class="stat-delta delta-neutral" id="fat-delta">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="to-go">—<span>kg</span></div>
        <div class="stat-label">距目标</div>
        <div class="stat-delta delta-neutral" id="days-label">—</div>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-labels">
        <span>起始 56.8kg</span>
        <span id="progress-pct">0%</span>
        <span>目标 52kg</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>
  </div>

  <!-- Chart card -->
  <div class="card">
    <div class="card-label">趋势图</div>
    <div class="chart-tabs">
      <button class="tab-btn active" onclick="switchTab('weight', this)">体重</button>
      <button class="tab-btn" onclick="switchTab('fat', this)">体脂</button>
    </div>
    <div class="chart-wrap">
      <canvas id="myChart"></canvas>
    </div>
  </div>

  <!-- Input card -->
  <div class="card">
    <div class="card-label">今日记录</div>
    <div class="form-row">
      <div class="field">
        <label>日期</label>
        <input type="date" id="inp-date">
      </div>
      <div class="field">
        <label>体重 (kg)</label>
        <input type="number" id="inp-weight" placeholder="56.8" step="0.1" min="30" max="150">
      </div>
    </div>
    <div class="form-row">
      <div class="field">
        <label>体脂 (%)</label>
        <input type="number" id="inp-fat" placeholder="31.6" step="0.1" min="5" max="60">
      </div>
      <div class="field">
        <label>运动内容</label>
        <input type="text" id="inp-exercise" placeholder="散步30分钟">
      </div>
    </div>
    <div class="form-row">
      <div class="field form-full">
        <label>饮食备注</label>
        <textarea id="inp-note" rows="2" placeholder="早: 燕麦+鸡蛋 / 午: 鸡胸+蔬菜 / 晚: 豆腐+沙拉"></textarea>
      </div>
    </div>
    <button class="btn-save" onclick="saveEntry()">保存今日记录</button>
  </div>

  <!-- Log card -->
  <div class="card">
    <div class="card-label">历史记录</div>
    <div class="log-list" id="log-list">
      <div class="empty-state">还没有记录，添加第一条吧 ✦</div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const START_WEIGHT = 56.8;
const GOAL_WEIGHT = 52.0;

let entries = JSON.parse(localStorage.getItem('slim-entries') || '[]');
let currentTab = 'weight';
let chart;

function getTodayStr() {
  return new Date().toISOString().slice(0, 10);
}

function formatDate(str) {
  const d = new Date(str + 'T00:00:00');
  return (d.getMonth() + 1) + '/' + d.getDate();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function saveEntry() {
  const date = document.getElementById('inp-date').value;
  const weight = parseFloat(document.getElementById('inp-weight').value);
  const fat = parseFloat(document.getElementById('inp-fat').value);
  const exercise = document.getElementById('inp-exercise').value.trim();
  const note = document.getElementById('inp-note').value.trim();

  if (!date || isNaN(weight)) { showToast('请填写日期和体重'); return; }

  const existing = entries.findIndex(e => e.date === date);
  const entry = { date, weight, fat: isNaN(fat) ? null : fat, exercise, note };
  if (existing >= 0) entries[existing] = entry;
  else entries.push(entry);

  entries.sort((a, b) => a.date.localeCompare(b.date));
  localStorage.setItem('slim-entries', JSON.stringify(entries));

  document.getElementById('inp-weight').value = '';
  document.getElementById('inp-fat').value = '';
  document.getElementById('inp-exercise').value = '';
  document.getElementById('inp-note').value = '';

  showToast('记录已保存 ✓');
  render();
}

function deleteEntry(date) {
  entries = entries.filter(e => e.date !== date);
  localStorage.setItem('slim-entries', JSON.stringify(entries));
  render();
}

function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updateChart();
}

function updateStats() {
  if (entries.length === 0) return;
  const latest = entries[entries.length - 1];
  const first = entries[0];

  document.getElementById('cur-weight').innerHTML = latest.weight.toFixed(1) + '<span>kg</span>';
  const wDelta = latest.weight - first.weight;
  const wEl = document.getElementById('weight-delta');
  if (wDelta < 0) { wEl.textContent = '▼ ' + Math.abs(wDelta).toFixed(1) + 'kg'; wEl.className = 'stat-delta delta-down'; }
  else if (wDelta > 0) { wEl.textContent = '▲ ' + wDelta.toFixed(1) + 'kg'; wEl.className = 'stat-delta delta-up'; }
  else { wEl.textContent = '—'; wEl.className = 'stat-delta delta-neutral'; }

  if (latest.fat !== null) {
    document.getElementById('cur-fat').innerHTML = latest.fat.toFixed(1) + '<span>%</span>';
    const fDelta = entries.length > 1 ? latest.fat - first.fat : 0;
    const fEl = document.getElementById('fat-delta');
    if (fDelta < 0) { fEl.textContent = '▼ ' + Math.abs(fDelta).toFixed(1) + '%'; fEl.className = 'stat-delta delta-down'; }
    else if (fDelta > 0) { fEl.textContent = '▲ ' + fDelta.toFixed(1) + '%'; fEl.className = 'stat-delta delta-up'; }
    else { fEl.textContent = '—'; fEl.className = 'stat-delta delta-neutral'; }
  }

  const toGo = Math.max(0, latest.weight - GOAL_WEIGHT);
  document.getElementById('to-go').innerHTML = toGo.toFixed(1) + '<span>kg</span>';
  document.getElementById('days-label').textContent = entries.length + ' 天记录';

  const pct = Math.min(100, Math.max(0, ((START_WEIGHT - latest.weight) / (START_WEIGHT - GOAL_WEIGHT)) * 100));
  document.getElementById('progress-fill').style.width = pct.toFixed(1) + '%';
  document.getElementById('progress-pct').textContent = pct.toFixed(0) + '%';
}

function updateChart() {
  const labels = entries.map(e => formatDate(e.date));
  const data = currentTab === 'weight'
    ? entries.map(e => e.weight)
    : entries.map(e => e.fat);

  const color = currentTab === 'weight' ? '#4A7C6F' : '#C5603A';
  const fillColor = currentTab === 'weight' ? 'rgba(74,124,111,0.08)' : 'rgba(197,96,58,0.08)';

  // Points with exercise/note get a larger highlighted dot
  const pointRadii = entries.map(e => (e.exercise || e.note) ? 6 : 4);
  const pointBorders = entries.map(e => (e.exercise || e.note) ? 2 : 0);

  if (chart) chart.destroy();

  chart = new Chart(document.getElementById('myChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data,
        borderColor: color,
        backgroundColor: fillColor,
        borderWidth: 2,
        pointBackgroundColor: color,
        pointBorderColor: '#fff',
        pointBorderWidth: pointBorders,
        pointRadius: pointRadii,
        pointHoverRadius: 8,
        fill: true,
        tension: 0.35
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1A1A18',
          titleColor: '#AEADA6',
          bodyColor: '#FFFFFF',
          padding: 12,
          cornerRadius: 10,
          titleFont: { family: 'DM Sans', size: 11 },
          bodyFont: { family: 'DM Sans', size: 12 },
          callbacks: {
            title: ctx => {
              const e = entries[ctx[0].dataIndex];
              return formatDate(e.date);
            },
            label: ctx => {
              const e = entries[ctx.dataIndex];
              const val = currentTab === 'weight'
                ? '体重  ' + e.weight.toFixed(1) + ' kg'
                : '体脂  ' + (e.fat !== null ? e.fat.toFixed(1) + ' %' : '—');
              return val;
            },
            afterLabel: ctx => {
              const e = entries[ctx.dataIndex];
              const lines = [];
              if (e.exercise) lines.push('运动  ' + e.exercise);
              if (e.note) lines.push('饮食  ' + e.note);
              return lines;
            }
          }
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { family: 'DM Sans', size: 11 }, color: '#AEADA6' } },
        y: {
          grid: { color: '#F0EEE8', lineWidth: 1 },
          ticks: { font: { family: 'DM Sans', size: 11 }, color: '#AEADA6',
            callback: v => currentTab === 'weight' ? v.toFixed(1) + 'kg' : v.toFixed(1) + '%'
          }
        }
      }
    }
  });
}

function updateLog() {
  const list = document.getElementById('log-list');
  if (entries.length === 0) {
    list.innerHTML = '<div class="empty-state">还没有记录，添加第一条吧 ✦</div>';
    return;
  }
  const sorted = [...entries].reverse();
  list.innerHTML = sorted.map(e => `
    <div class="log-row">
      <span class="log-date">${formatDate(e.date)}</span>
      <span class="log-weight">${e.weight.toFixed(1)} kg</span>
      <span class="log-fat">${e.fat !== null ? e.fat.toFixed(1) + '%' : '—'}</span>
      <span class="log-note">${e.exercise || e.note || ''}</span>
      <button class="del-btn" onclick="deleteEntry('${e.date}')">×</button>
    </div>
  `).join('');
}

function render() {
  updateStats();
  updateChart();
  updateLog();
}

// Init
document.getElementById('inp-date').value = getTodayStr();
render();
</script>
</body>
</html>
